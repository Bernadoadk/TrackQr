# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "481729838468b88aa0a9197002747a55"
name = "TrackQr"
application_url = "https://track-qr-green.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  # ── Compliance webhooks (GDPR) — déclarés dans le Partner Dashboard via
  # cette section spéciale, PAS comme des subscriptions classiques.
  [webhooks.privacy_compliance]
  customer_deletion_url      = "/webhooks/customers/redact"
  customer_data_request_url  = "/webhooks/customers/data_request"
  shop_deletion_url          = "/webhooks/shop/redact"

  # ── Webhooks applicatifs classiques
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app/subscriptions_update"

  # ⚠ orders/create et orders/paid contiennent des "protected customer data"
  # (nom, email, adresse client). L'app DOIT être approuvée pour ces données
  # par Shopify — voir la procédure plus bas.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products   — product / variant / collection pickers (Create, Bulk create, campaigns)
# write_discounts — promo codes created from the Create page and capture rewards
# read_orders     — order webhooks used for sales attribution
scopes = "read_products,write_discounts,read_orders"
# Requested only when a merchant turns on "Leads → Shopify customers" (Growth),
# from Settings, through App Bridge shopify.scopes.request().
optional_scopes = [ "write_customers" ]

[auth]
redirect_urls = [ "https://track-qr-green.vercel.app/auth/callback" ]
